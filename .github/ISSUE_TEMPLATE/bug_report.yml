name: Bug report
description: Something Guardrails did wrong — a false block, a missed check, a crash.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a guard **bypass**, please use a private
        [security advisory](https://github.com/rossedman/guardrails/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the message Claude or you saw, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The hook event payload (`guardrails hook <event>` input) is ideal.
      render: shell
  - type: textarea
    id: doctor
    attributes:
      label: guardrails doctor output
      render: text
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      placeholder: claude --version
