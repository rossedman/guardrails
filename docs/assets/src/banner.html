<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1280px; height: 400px; }
  body {
    background:
      radial-gradient(900px 420px at 12% 30%, rgba(245,184,61,0.17), transparent 70%),
      radial-gradient(700px 400px at 92% 110%, rgba(108,196,240,0.11), transparent 70%),
      var(--ink);
  }
  .grid { mask-image: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(0,0,0,0.15)); }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 72px; gap: 44px; }
  .logo { width: 150px; height: 178px; flex: none; filter: drop-shadow(0 18px 30px rgba(0,0,0,0.5)); }
  .text { flex: 1; }
  h1 { font-size: 98px; font-weight: 800; letter-spacing: -4px; line-height: 0.95; }
  h1 span { color: var(--amber); }
  p { margin-top: 18px; font-size: 25px; line-height: 1.35; color: var(--mist); white-space: nowrap; }
  p b { color: var(--cream); font-weight: 600; }
  .term {
    width: 440px; flex: none; border-radius: 14px; background: var(--well);
    border: 1px solid var(--ink-3); box-shadow: 0 24px 60px rgba(0,0,0,0.55); overflow: hidden;
  }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--ink-2); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #2a3560; display: block; }
  .body { padding: 16px 20px 18px; font-size: 15.5px; line-height: 1.72; color: var(--mist); white-space: pre; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <img class="logo" src="logo.svg" alt="">
    <div class="text">
      <h1>guard<span>rails</span></h1>
      <p>Quality gates for Claude Code.<br><b>Format every edit. Gate every turn.</b></p>
    </div>
    <div class="term mono">
      <div class="bar"><i></i><i></i><i></i></div>
<div class="body"><span class="d">PostToolUse</span>  <span class="ok">✓</span> gofumpt <span class="d">·</span> golangci-lint
<span class="d">Stop</span>  <span class="bad">✗ go gate failed (1 of 6)</span>
  <span class="p">[coverage]</span> 84.2% <span class="d">&lt;</span> 90.0%
  <span class="d">queue.go:41</span>  <span class="s">(*Queue).Drain</span>
<span class="d">Stop</span>  <span class="ok">✓ go gate passed</span> <span class="d">· cov 92.6%</span></div>
    </div>
  </div>
</body></html>
