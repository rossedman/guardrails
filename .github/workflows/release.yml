name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Plugin version matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$want" != "$got" ]; then
            echo "::error::.claude-plugin/plugin.json version is $got but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
