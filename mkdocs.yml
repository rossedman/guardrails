site_name: Guardrails
site_description: Quality gates for Claude Code — format on every edit, gate every turn.
site_url: https://rossedman.github.io/guardrails/
repo_url: https://github.com/rossedman/guardrails
repo_name: rossedman/guardrails
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Ross Edman — MIT License

# Strict builds (CI) fail on broken links; #anchors between pages warn.
validation:
  links:
    anchors: warn

# Sources for the README graphics, rendered by docs/assets/render.sh.
exclude_docs: |
  /assets/src/
  /assets/render.sh

theme:
  name: material
  custom_dir: overrides
  logo: assets/site/logo.svg
  favicon: assets/site/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline

# Design system: tokens and the landing page in landing.css, doc pages in
# docs.css. The README graphics share the tokens (docs/assets/src/brand.css).
extra_css:
  - assets/site/landing.css
  - assets/site/docs.css
extra_javascript:
  - assets/site/landing.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossedman/guardrails
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - How it works: how-it-works.md
      - Hook events: hooks.md
      - Feedback format: feedback.md
      - Hardening tests: harden.md
      - Insights: insights.md
      - Lessons: lessons.md
  - Languages:
      - Go: go.md
      - Python: python.md
      - Shell: shell.md
      - YAML: yaml.md
      - Terraform: terraform.md
      - Docker: docker.md
  - Reference:
      - Policy guards: guards.md
      - Dependency check: dependencies.md
      - Tool provisioning: tools.md
      - Configuration: configuration.md
      - CLI: cli.md
      - CI and pre-commit: ci.md
      - Companion tools: companion-tools.md
  - Project:
      - Roadmap: roadmap.md
      - Contributing: contributing.md
