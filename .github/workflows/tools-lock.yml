name: Tools lock

# Regenerates internal/tools/tools.lock.json (URLs and SHA-256 for every
# pinned tool on every platform). Run it after editing tools.yaml, or let the
# weekly schedule open a pull request when upstream artifacts change.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the lock branch
      pull-requests: write # open the pull request
      actions: write # dispatch the required checks on the pull request
    steps:
      # Credentials stay: create-pull-request pushes the branch with them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Regenerate lock
        run: go run ./internal/tools/lockgen
      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/tools-lock
          commit-message: "chore(tools): regenerate tools lock"
          title: "chore(tools): regenerate tools lock"
          body: |
            Regenerated `internal/tools/tools.lock.json` from `internal/tools/tools.yaml`.
            Every artifact was downloaded, hashed and checked for its executable.
      - name: Run the required checks on the pull request
        # A pull request opened with GITHUB_TOKEN triggers no workflows, but a
        # dispatch does, and its check runs count toward the main ruleset's
        # required checks on the branch's head commit.
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run codeql.yml --ref "$BRANCH"
